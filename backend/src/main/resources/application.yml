# ===================================================================
# 公共配置（dev/prod 差异见 application-{profile}.yml）
# ===================================================================
spring:
  application:
    name: winxin-blog
  # 默认激活 dev，生产环境用环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Java 21 虚拟线程：Tomcat 请求处理、@Async 等自动使用虚拟线程（Boot 3.2+ 引入，4.x 沿用）
  threads:
    virtual:
      enabled: true

mybatis-plus:
  configuration:
    # 数据库下划线列名 -> 实体驼峰属性
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 主键策略：雪花 ID（避免自增 ID 泄露业务量，且分库分表友好）
      id-type: assign_id
      # 逻辑删除（预留：init.sql 已含 deleted 字段；启用策略由你决定）
      # logic-delete-field: deleted

springdoc:
  packages-to-scan: com.winxin.blog.controller
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    # 逗号分隔；生产环境用环境变量 APP_CORS_ALLOWED_ORIGINS 覆盖（必填，不写默认值防止线上误放行）
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
