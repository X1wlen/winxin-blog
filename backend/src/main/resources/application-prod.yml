# ===================================================================
# 生产环境
# 敏感配置（数据库、Redis）只从环境变量读取，不提供默认值：缺失即启动失败（fail-fast）
# ===================================================================
server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

logging:
  level:
    com.winxin.blog: info
    root: warn

# 生产环境关闭接口文档，避免暴露 API 结构
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
